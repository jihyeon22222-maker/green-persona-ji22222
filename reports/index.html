<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>환경재단 성과보고서</title>
<meta name="description" content="환경재단 성과보고서 '푸른발자국 VOL.23'을 책장 넘기듯 볼 수 있는 페이지.">
<meta property="og:type" content="website">
<meta property="og:title" content="환경재단 성과보고서 · 푸른발자국 VOL.23">
<meta property="og:description" content="표지를 누르면 보고서가 펼쳐져요. 한 장씩 넘기며 읽어 보세요.">
<meta property="og:image" content="green-step-vol23/pages/01.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --paper: #FAF8F2;
    --card: #FFFFFF;
    --ink: #1B1B1B;
    --ink-soft: #55534D;
    --line: #E4E0D5;
    --glow: rgba(255, 215, 1, .32);
    --shadow: rgba(60, 45, 0, .38);
    --brand: #FFD701;
    --brand-deep: #E0BC00;
    --viewer-bg: #1E1D1A;
    --viewer-ink: #F4F1E8;
    --viewer-soft: #A9A59A;
    --gutter: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171613; --card: #211F1B; --ink: #F2EFE6; --ink-soft: #B3AEA2; --line: #37342D;
      --glow: rgba(255, 215, 1, .14); --shadow: rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171613; --card: #211F1B; --ink: #F2EFE6; --ink-soft: #B3AEA2; --line: #37342D;
    --glow: rgba(255, 215, 1, .14); --shadow: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
    word-break: keep-all;
  }
  body.viewer-open { overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  /* 가운데 한 장면: 제목 한 줄, 그 아래 조명 받은 표지 한 권 */
  .scene {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(28px, 5vh, 56px);
    padding: 48px var(--gutter) 56px;
    background:
      radial-gradient(ellipse 60% 55% at 50% 62%, var(--glow), transparent 70%),
      var(--paper);
    overflow: hidden;
  }
  .scene h1 {
    margin: 0; text-align: center; text-wrap: balance;
    font-size: clamp(28px, 4.6vw, 52px); font-weight: 900; letter-spacing: -.035em; line-height: 1.2;
  }
  .scene h1 span { font-weight: 500; color: var(--ink-soft); margin-right: .25em; }

  .hero-book {
    position: relative; display: block;
    width: min(360px, 72vw);
    width: min(440px, 72vw, calc((100svh - 230px) / 1.414)); max-width: 100%; aspect-ratio: 1000 / 1414;
    padding: 0; border: 0; background: none; cursor: pointer;
    perspective: 1800px;
    animation: float 6s ease-in-out infinite;
  }
  .hero-book:focus-visible { outline: none; }
  .hero-book:focus-visible .floor { opacity: 1; box-shadow: 0 0 0 3px var(--ink); }
  .hero-book .inside, .hero-book .cover {
    position: absolute; inset: 0; border-radius: 2px 6px 6px 2px; overflow: hidden;
  }
  .hero-book .inside { background: #fff; box-shadow: 0 30px 60px -20px var(--shadow); }
  .hero-book .inside img, .hero-book .cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .hero-book .inside::after { /* 펼친 안쪽 그늘 */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.28), transparent 30%);
  }
  .hero-book .cover {
    transform-origin: left center; transform: rotateY(0deg);
    transition: transform .7s cubic-bezier(.2,.7,.2,1);
    box-shadow: 0 2px 0 rgba(0,0,0,.05), 0 40px 70px -24px var(--shadow), 0 18px 30px -18px var(--shadow);
  }
  .hero-book .cover::before { /* 책등 */
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 5%;
    background: linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,.05) 70%, rgba(255,255,255,.35));
  }
  .hero-book .cover::after { /* 빛 반사 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.28), transparent 38%);
    transition: opacity .7s; opacity: .8;
  }
  .hero-book .edge { /* 종이 두께 */
    position: absolute; top: 1.2%; bottom: 1.2%; right: -2.4%; width: 2.6%;
    background: repeating-linear-gradient(90deg, #fff 0 1px, #E7E1D2 1px 2px);
    border-radius: 0 3px 3px 0; box-shadow: 4px 6px 12px -6px var(--shadow);
  }
  .hero-book .floor {
    position: absolute; left: 6%; right: 6%; bottom: -34px; height: 18px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--shadow), transparent);
    opacity: .9; transition: opacity .3s;
  }
  .hero-book:hover, .hero-book:focus-visible { animation-play-state: paused; }
  .hero-book:hover .cover, .hero-book:focus-visible .cover { transform: rotateY(-28deg); }
  .hero-book:hover .cover::after { opacity: .3; }
  .tap-hint {
    margin: 0; font-size: 14px; color: var(--ink-soft); letter-spacing: .02em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tap-hint::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-deep); animation: pulse 2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (hover: none) {
    .hero-book .cover { transform: rotateY(-8deg); }
  }

  /* ---------- 보고서 뷰어 ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 100;
    display: grid; grid-template-rows: auto 1fr auto;
    background: radial-gradient(ellipse at 50% 45%, #34322C 0%, var(--viewer-bg) 70%);
    color: var(--viewer-ink);
    opacity: 0; transition: opacity .35s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .viewer[hidden] { display: none; }
  .viewer.is-open { opacity: 1; }
  .viewer-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 56px; padding: 0 var(--gutter);
  }
  .viewer-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-title small { font-weight: 400; color: var(--viewer-soft); margin-left: 8px; }
  .icon-btn {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.08); display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,.16); }
  .icon-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .stage { position: relative; min-height: 0; padding: 8px var(--gutter); }
  .stage-inner { position: relative; width: 100%; height: 100%; }
  .book-shift {
    position: absolute; inset: 0;
    transition: transform .8s cubic-bezier(.4,.1,.2,1), opacity .2s;
  }
  .book-shift.no-anim { transition: none; }
  .flipbook { width: 100%; height: 100%; }
  .flipbook .stf__wrapper { position: relative; width: 100%; height: 100%; padding: 0 !important; }
  .fb-page { background: #fff; overflow: hidden; }
  .fb-page img { width: 100%; height: 100%; display: block; object-fit: cover; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .fb-page::after { /* 가운데 접힘 그늘 */
    content: ""; position: absolute; top: 0; bottom: 0; width: 7%; pointer-events: none;
  }
  .fb-page.--left::after { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.12)); }
  .fb-page.--right::after { left: 0; background: linear-gradient(270deg, transparent, rgba(0,0,0,.12)); }
  .fb-page[data-density="hard"]::after { display: none; }

  .flying-cover {
    position: fixed; z-index: 101; margin: 0; pointer-events: none;
    transform-origin: 0 0; border-radius: 2px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    transition: transform .65s cubic-bezier(.3,.1,.2,1);
  }

  .viewer-controls {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 8px var(--gutter) 14px;
  }
  .pager { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 12px; }
  .pager input[type=range] { flex: 1; accent-color: var(--brand); min-width: 0; height: 28px; }
  .page-no { min-width: 86px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--viewer-soft); }
  .page-no b { color: var(--viewer-ink); font-weight: 700; }
  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 13px; color: var(--viewer-soft); background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 99px;
    white-space: nowrap; pointer-events: none; transition: opacity .6s; z-index: 5;
  }
  .hint.is-gone { opacity: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 560px) {
    .viewer-title small { display: none; }
    .viewer-controls { gap: 8px; }
    .page-no { min-width: 70px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-book, .hero-book .cover, .tap-hint::before, .book-shift, .viewer, .flying-cover { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<main class="scene">
  <h1><span>환경재단</span>성과보고서</h1>
  <button class="hero-book" id="heroBook" type="button" aria-label="푸른발자국 VOL.23 펼쳐 보기">
    <span class="edge"></span>
    <span class="inside"><img src="green-step-vol23/pages/03.webp" alt="" width="1000" height="1414"></span>
    <span class="cover"><img id="heroCover" src="green-step-vol23/pages/01.webp" alt="" width="1000" height="1414"></span>
    <span class="floor"></span>
  </button>
  <p class="tap-hint">표지를 누르면 펼쳐져요</p>
</main>

<!-- 보고서 뷰어 -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
  <div class="viewer-bar">
    <div class="viewer-title" id="viewerTitle"></div>
    <div style="display:flex; gap:8px">
      <a class="icon-btn" id="viewerPdf" href="#" download aria-label="PDF 내려받기" title="PDF 내려받기">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      </a>
      <button class="icon-btn" id="viewerClose" type="button" aria-label="닫기" title="닫기 (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="stage-inner" id="stageInner">
      <div class="book-shift" id="bookShift"></div>
    </div>
    <div class="hint" id="hint">모서리를 끌거나 화면을 눌러 넘겨 보세요</div>
  </div>
  <div class="viewer-controls">
    <button class="icon-btn" id="prevBtn" type="button" aria-label="이전 쪽">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="pager">
      <label class="sr-only" for="pageRange">쪽 이동</label>
      <input type="range" id="pageRange" min="1" value="1">
      <div class="page-no" id="pageNo" aria-live="polite"></div>
    </div>
    <button class="icon-btn" id="nextBtn" type="button" aria-label="다음 쪽">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script src="vendor/page-flip.browser.js"></script>
<script>
(() => {
  // 쪽 이미지는 pages/01.webp 부터 차례대로.
  const REPORTS = [
    {
      id: "green-step-vol23",
      vol: "VOL. 23",
      title: "푸른발자국",
      subtitle: "2025 환경재단 활동 보고서",
      date: "2025.11.11 발행",
      pageCount: 60,
      ext: "webp",
      pdf: "green-step-vol23/green-step-vol23.pdf",
    },
  ];

  const PAGE_RATIO = 1414 / 1000; // 높이 / 너비
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const pageSrc = (r, i) => `${r.id}/pages/${String(i + 1).padStart(2, "0")}.${r.ext}`;

  // ---------- 표지 ----------
  const hero = $("heroBook");
  hero.addEventListener("click", () => openViewer(REPORTS[0], $("heroCover"), hero));

  // ---------- 뷰어 ----------
  const viewer = $("viewer"), stageInner = $("stageInner"), bookShift = $("bookShift");
  const range = $("pageRange"), pageNo = $("pageNo"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), hint = $("hint");
  let report = null, flip = null, layout = null, opener = null, imgs = [];

  function computeLayout() {
    const W = stageInner.clientWidth, H = stageInner.clientHeight;
    const landscape = W / H > 1.05;
    const pageW = Math.floor(landscape ? Math.min(W / 2, H / PAGE_RATIO) : Math.min(W, H / PAGE_RATIO));
    return { W, H, landscape, pageW, pageH: Math.floor(pageW * PAGE_RATIO) };
  }

  // 표지·뒤표지는 한 쪽만 보이므로, 펼친 화면에서 책을 가운데로 옮겨 줘요.
  function shiftFor(idx) {
    if (!layout || !layout.landscape) return 0;
    if (idx === 0) return -layout.pageW / 2;
    if (idx === report.pageCount - 1) return layout.pageW / 2;
    return 0;
  }
  function applyShift(px, animate = true) {
    bookShift.classList.toggle("no-anim", !animate || reduceMotion);
    bookShift.style.transform = `translateX(${px}px)`;
  }

  function ensureLoaded(center) {
    for (let d = -3; d <= 5; d++) {
      const img = imgs[center + d];
      if (img && !img.src) img.src = img.dataset.src;
    }
  }
  function loadRestInBackground() {
    // 가까운 쪽부터 다 불러오면 나머지는 한가할 때 하나씩
    const next = () => {
      if (!flip) return;
      const img = imgs.find((im) => !im.src);
      if (!img) return;
      img.src = img.dataset.src;
      img.decode?.().catch(() => {}).finally(() => setTimeout(next, 60));
    };
    setTimeout(next, 800);
  }

  function buildFlip(startPage) {
    layout = computeLayout();
    const el = document.createElement("div");
    el.className = "flipbook";
    bookShift.replaceChildren(el);

    imgs = [];
    const pages = [];
    for (let i = 0; i < report.pageCount; i++) {
      const p = document.createElement("div");
      p.className = "fb-page";
      if (i === 0 || i === report.pageCount - 1) p.dataset.density = "hard";
      const img = new Image(1000, 1414);
      img.alt = `${i + 1}쪽`;
      img.decoding = "async";
      img.dataset.src = pageSrc(report, i);
      p.appendChild(img);
      imgs.push(img);
      pages.push(p);
    }
    ensureLoaded(startPage);

    flip = new St.PageFlip(el, {
      width: layout.pageW,
      height: layout.pageH,
      size: "fixed",
      autoSize: false,
      usePortrait: true,
      showCover: true,
      startPage,
      flippingTime: reduceMotion ? 300 : 850,
      maxShadowOpacity: 0.45,
      mobileScrollSupport: false,
      swipeDistance: 20,
    });
    flip.loadFromHTML(pages);

    flip.on("flip", (e) => { onPage(e.data); applyShift(shiftFor(e.data)); });
    flip.on("changeState", (e) => {
      const idx = flip.getCurrentPageIndex();
      if (e.data === "flipping" || e.data === "user_fold") {
        hint.classList.add("is-gone");
        if (idx === 0 || idx === report.pageCount - 1) applyShift(0);
        ensureLoaded(idx);
      } else if (e.data === "read") {
        applyShift(shiftFor(idx));
      }
    });
    applyShift(shiftFor(startPage), false);
    onPage(startPage);
  }

  function onPage(idx) {
    const n = report.pageCount;
    ensureLoaded(idx);
    let label;
    if (layout.landscape && idx > 0 && idx < n - 1) {
      const left = idx % 2 === 1 ? idx : idx - 1;
      label = `<b>${left + 1}–${left + 2}</b> / ${n}`;
    } else {
      label = `<b>${idx + 1}</b> / ${n}`;
    }
    pageNo.innerHTML = label;
    range.value = idx + 1;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === n - 1;
  }

  function goNext() {
    if (!flip) return;
    const idx = flip.getCurrentPageIndex();
    if (idx === 0 || idx === report.pageCount - 1) applyShift(0);
    flip.flipNext();
  }
  function goPrev() {
    if (!flip) return;
    const idx = flip.getCurrentPageIndex();
    if (idx === report.pageCount - 1 || idx === 0) applyShift(0);
    flip.flipPrev();
  }
  function jumpTo(idx) {
    if (!flip) return;
    ensureLoaded(idx);
    flip.turnToPage(idx);
    const cur = flip.getCurrentPageIndex();
    onPage(cur);
    applyShift(shiftFor(cur), false);
  }

  async function openViewer(r, coverImg, openerEl) {
    report = r;
    opener = openerEl;
    $("viewerTitle").innerHTML = `${r.title} ${r.vol}<small>${r.subtitle}</small>`;
    $("viewerPdf").href = r.pdf;
    range.max = r.pageCount;
    hint.classList.remove("is-gone");

    viewer.hidden = false;
    document.body.classList.add("viewer-open");
    await nextFrame();
    viewer.classList.add("is-open");

    buildFlip(0);
    bookShift.style.opacity = "0";

    // 책장 위의 표지가 날아와서 뷰어 속 표지 자리에 놓여요.
    const from = coverImg.getBoundingClientRect();
    const box = stageInner.getBoundingClientRect();
    const to = {
      left: box.left + (layout.W - layout.pageW) / 2,
      top: box.top + (layout.H - layout.pageH) / 2,
      width: layout.pageW,
      height: layout.pageH,
    };
    if (!reduceMotion && from.width > 0) {
      const fly = document.createElement("img");
      fly.className = "flying-cover";
      fly.src = coverImg.currentSrc || coverImg.src;
      Object.assign(fly.style, { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" });
      const sx = from.width / to.width, sy = from.height / to.height;
      fly.style.transform = `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${sx}, ${sy})`;
      document.body.appendChild(fly);
      await nextFrame();
      fly.style.transform = "none";
      await waitTransition(fly, 750);
      bookShift.style.opacity = "1";
      await nextFrame();
      fly.remove();
    } else {
      bookShift.style.opacity = "1";
    }
    $("viewerClose").focus({ preventScroll: true });
    loadRestInBackground();

    // 표지가 자리 잡으면 저절로 첫 장을 넘겨 책을 펼쳐요.
    setTimeout(() => { if (flip && flip.getCurrentPageIndex() === 0) goNext(); }, reduceMotion ? 0 : 280);
  }

  function closeViewer() {
    if (viewer.hidden) return;
    viewer.classList.remove("is-open");
    const done = () => {
      viewer.hidden = true;
      document.body.classList.remove("viewer-open");
      if (flip) { flip.destroy(); flip = null; }
      bookShift.replaceChildren();
      opener?.focus({ preventScroll: true });
    };
    reduceMotion ? done() : setTimeout(done, 350);
  }

  const nextFrame = () => new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res)));
  const waitTransition = (el, ms) => new Promise((res) => {
    const t = setTimeout(res, ms);
    el.addEventListener("transitionend", () => { clearTimeout(t); res(); }, { once: true });
  });

  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);
  $("viewerClose").addEventListener("click", closeViewer);
  range.addEventListener("input", () => {
    pageNo.innerHTML = `<b>${range.value}</b> / ${report.pageCount}`;
  });
  range.addEventListener("change", () => jumpTo(Number(range.value) - 1));

  document.addEventListener("keydown", (e) => {
    if (viewer.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); closeViewer(); }
    else if (e.target === range) return;
    else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goPrev(); }
    else if (e.key === "Home") { e.preventDefault(); jumpTo(0); }
    else if (e.key === "End") { e.preventDefault(); jumpTo(report.pageCount - 1); }
    else if (e.key === "Tab") { // 뷰어 안에서만 포커스가 돌도록
      const f = [...viewer.querySelectorAll("a[href], button:not(:disabled), input")];
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // 화면 크기가 바뀌면 지금 쪽을 유지한 채 책을 다시 짜요.
  let resizeTimer;
  window.addEventListener("resize", () => {
    if (!flip) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!flip) return;
      const cur = flip.getCurrentPageIndex();
      const next = computeLayout();
      if (next.W === layout.W && next.H === layout.H) return;
      flip.destroy();
      buildFlip(cur);
    }, 200);
  });
})();
</script>
</body>
</html>
