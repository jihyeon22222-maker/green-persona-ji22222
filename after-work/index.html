<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="지금 상태만 고르면, 오늘의 퇴근 후 코스를 처방해 드립니다." />
  <title>퇴근하고 뭐하지?</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" type="button" data-action="home" aria-label="처음으로">퇴근하고 뭐하지?</button>
    <div class="clock" aria-live="off">
      <span class="clock-dot" aria-hidden="true"></span>
      <span id="clock">--:--</span>
    </div>
  </header>

  <main class="wrap">
    <!-- ───────── 선택 화면 ───────── -->
    <section id="view-select" class="view is-active" aria-labelledby="headline">
      <div class="hero">
        <p class="eyebrow" id="countdown">오늘도 수고하셨습니다</p>
        <h1 id="headline">오늘 퇴근하고<br />뭐 하지?</h1>
        <p class="lede">지금 상태만 알려주세요.<br />나머지 저녁은 저희가 짜 드립니다.</p>
      </div>

      <form id="form" class="form" novalidate>
        <fieldset class="group" data-group="energy">
          <legend><span class="num">01</span>오늘의 체력</legend>
          <div class="options options--list">
            <label class="opt">
              <input type="radio" name="energy" value="1" />
              <span class="opt-body">
                <span class="opt-icon" aria-hidden="true">🪫</span>
                <span class="opt-main">10%</span>
                <span class="opt-sub">집까지 가는 것도 힘듦</span>
              </span>
            </label>
            <label class="opt">
              <input type="radio" name="energy" value="2" />
              <span class="opt-body">
                <span class="opt-icon" aria-hidden="true">🔋</span>
                <span class="opt-main">40%</span>
                <span class="opt-sub">뭐 하나 정도는 가능</span>
              </span>
            </label>
            <label class="opt">
              <input type="radio" name="energy" value="3" />
              <span class="opt-body">
                <span class="opt-icon" aria-hidden="true">🔋</span>
                <span class="opt-main">70%</span>
                <span class="opt-sub">아직 살아 있음</span>
              </span>
            </label>
            <label class="opt">
              <input type="radio" name="energy" value="4" />
              <span class="opt-body">
                <span class="opt-icon" aria-hidden="true">⚡</span>
                <span class="opt-main">100%</span>
                <span class="opt-sub">오늘 집에 바로 갈 생각 없음</span>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset class="group" data-group="budget">
          <legend><span class="num">02</span>오늘 쓸 수 있는 돈</legend>
          <div class="options options--grid">
            <label class="opt opt--tile"><input type="radio" name="budget" value="0" /><span class="opt-body"><span class="opt-main">0원</span></span></label>
            <label class="opt opt--tile"><input type="radio" name="budget" value="1" /><span class="opt-body"><span class="opt-main">1만원</span></span></label>
            <label class="opt opt--tile"><input type="radio" name="budget" value="2" /><span class="opt-body"><span class="opt-main">3만원</span></span></label>
            <label class="opt opt--tile"><input type="radio" name="budget" value="3" /><span class="opt-body"><span class="opt-main">오늘은 FLEX</span></span></label>
          </div>
        </fieldset>

        <fieldset class="group" data-group="curfew">
          <legend><span class="num">03</span>몇 시까지 집에 들어가고 싶나요</legend>
          <div class="options options--grid">
            <label class="opt opt--tile"><input type="radio" name="curfew" value="1200" /><span class="opt-body"><span class="opt-main">8시</span></span></label>
            <label class="opt opt--tile"><input type="radio" name="curfew" value="1320" /><span class="opt-body"><span class="opt-main">10시</span></span></label>
            <label class="opt opt--tile"><input type="radio" name="curfew" value="1440" /><span class="opt-body"><span class="opt-main">자정</span></span></label>
            <label class="opt opt--tile"><input type="radio" name="curfew" value="free" /><span class="opt-body"><span class="opt-main">시간 상관없음</span></span></label>
          </div>
        </fieldset>
      </form>

      <div class="dock" id="dock">
        <p class="dock-hint" id="progress">세 가지를 골라주세요 · 0 / 3</p>
        <button type="button" class="btn btn--primary btn--xl" id="btn-decide" disabled>내 퇴근을 결정해주세요</button>
      </div>
    </section>

    <!-- ───────── 결과 화면 ───────── -->
    <section id="view-result" class="view" aria-labelledby="rx-title" hidden>
      <button type="button" class="back" data-action="home">
        <span aria-hidden="true">←</span> 조건 다시 고르기
      </button>

      <article class="rx" id="rx">
        <div class="rx-stamp" aria-hidden="true">
          <span>ACCEPTED</span>
          <small id="stamp-time"></small>
        </div>

        <header class="rx-head">
          <div class="rx-meta">
            <span id="rx-no">No. 0000-0000</span>
            <span id="rx-date"></span>
          </div>
          <h2 id="rx-title">오늘의 퇴근 처방전</h2>
          <ul class="rx-tags" id="rx-tags"></ul>
        </header>

        <ol class="timeline" id="timeline" aria-live="polite"></ol>

        <footer class="rx-foot">
          <p class="comment" id="comment"></p>
        </footer>
      </article>

      <div class="actions" id="actions">
        <button type="button" class="btn btn--primary btn--xl" id="btn-accept">이 운명을 받아들인다</button>
        <button type="button" class="btn btn--ghost btn--xl" id="btn-reroll">다시 뽑기</button>
      </div>

      <div class="actions" id="actions-accepted" hidden>
        <p class="accepted-note" id="accepted-note"></p>
        <button type="button" class="btn btn--primary btn--xl" id="btn-copy">처방전 복사하기</button>
        <button type="button" class="btn btn--ghost btn--xl" data-action="home">처음으로</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
